name: Build PirateRealms APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Restore debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Package PirateRealms.apk
        run: |
          mkdir -p build-apk
          cp app/build/outputs/apk/debug/app-debug.apk build-apk/PirateRealms.apk

      - name: Upload PirateRealms.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PirateRealms-APK
          path: build-apk/PirateRealms.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish PirateRealms.apk to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" build-apk/PirateRealms.apk \
            --title "Pirate Realms v1.0.${{ github.run_number }}" \
            --notes "ไฟล์ติดตั้ง Android (PirateRealms.apk) และ Source Code ล่าสุด" \
            --latest
